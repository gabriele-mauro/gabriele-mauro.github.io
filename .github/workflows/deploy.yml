name: Deploy to GitHub Pages

on:
  # Every push to main, and manually from the Actions tab
  push:
    branches: [main]
  workflow_dispatch:

# Allow this job to clone the repo and create a page deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, so "Last updated" can read the date of the latest content commit

      - name: Install, build, and upload your site
        uses: withastro/action@v6
        with:
          node-version: 24 # same as .nvmrc
        env:
          # Private patterns for scripts/check-content.mjs (the build fails on any match)
          PRIVATE_DENYLIST: ${{ secrets.PRIVATE_DENYLIST }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
